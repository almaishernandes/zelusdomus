<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Zelus Domus</title>

    <!-- PWA: instalação como app no Android e "Adicionar à Tela de Início" no iPhone -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7e14ff" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zelus Domus" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root">
      <!-- Ocupa o tempo de carregamento inicial (antes do React montar) com a
           oração do Santo Anjo. É substituído automaticamente assim que o app
           termina de carregar. -->
      <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#1e293b; padding:1.5rem; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="max-width:360px; text-align:center; color:#f1f5f9;">
          <div style="width:44px; height:44px; margin:0 auto 1.2rem; border:3px solid rgba(241,245,249,0.25); border-top-color:#f1f5f9; border-radius:50%; animation:zd-spin 0.9s linear infinite;"></div>
          <p style="font-size:0.85rem; margin:0 0 1rem; color:#93c5fd;">Enquanto aguardamos o login, rezemos juntos:</p>
          <p style="font-size:0.72rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#93c5fd; margin:0 0 0.8rem;">Santo Anjo do Senhor</p>
          <p style="font-size:0.95rem; font-weight:700; text-transform:uppercase; line-height:1.7; margin:0; color:#e2e8f0;">
            Meu zeloso guardador,<br>
            se a ti confiou a piedade divina,<br>
            sempre me rege,<br>
            sempre me guarde,<br>
            sempre me governe,<br>
            sempre me ilumine.<br>
            Amém.
          </p>
        </div>
      </div>
      <style>@keyframes zd-spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
