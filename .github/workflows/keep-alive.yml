name: Manter Supabase Ativo

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao Supabase
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/communities?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
